submission:
  title: "GhostBusters - AI Code Bloat Janitor" # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    As teams use AI assistants to generate code quickly, codebases accumulate subtle technical debt like orphaned helper functions and ghost dependencies. Standard linters miss this semantic bloat, causing enterprise teams to deploy unnecessarily heavy, confusing applications.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    GhostBusters is a hybrid application featuring a web dashboard and an MCP server that intelligently scans code for ghost dependencies. It uses a token-efficient strategy with IBM Bob to verify dead code and propose automated cleanups.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Token-efficient, zero-shot local code scanning for ghost dependencies"
    - "Model Context Protocol (MCP) server integration with IBM Bob"
    - "Automated execution of multi-file dead code removal"
    - "Beautiful visual web dashboard for tracking repository tech debt" 

  tech_stack:
    languages: ["TypeScript", "JavaScript", "CSS"] # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["React", "Vite", "Node.js"]       # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob", "watsonx.ai"]    # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: []                                  # e.g., ["PostgreSQL", "Redis"]
    other: ["Model Context Protocol (MCP)", "Esprima"] # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Replace with what aspect of the submission you consider strongest
    and want judges to pay special attention to.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Replace with any known limitations, incomplete features,
    or shortcuts taken due to time constraints.

